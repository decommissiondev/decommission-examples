name = "decommission-generated"
main = "worker.ts"
compatibility_date = "2026-10-01"
workers_dev = true
# Set your own account before deployment (or use CLOUDFLARE_ACCOUNT_ID).
# account_id = "YOUR_32_CHARACTER_CLOUDFLARE_ACCOUNT_ID"

