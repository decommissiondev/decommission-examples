name: Example tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/webhook-routing/package-lock.json
      - run: npm ci
        working-directory: examples/webhook-routing
      - run: npm test
        working-directory: examples/webhook-routing
